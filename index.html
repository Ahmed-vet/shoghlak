<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12202F"><meta name="description" content="إعلانات وظائف مصانع وأمن ومحطات بنزين">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="شغلك"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>شغلك – وظائف مصانع وأمن ومحطات بنزين</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12202F;--ink2:#1C2E4A;--green:#1F5C4D;--copper:#B4692F;--gold:#B8944F;--gold-s:#EFE5CC;--bg:#F6F3EC;--line:#E4DED0;--mut:#6B7280;--red:#A63D40;--r:16px;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}body{background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;padding:0 max(20px,calc((100% - 1150px)/2));flex-wrap:wrap;border-bottom:1px solid rgba(184,148,79,.35)}
.logo{font-family:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;font-weight:600;font-size:30px;padding:10px 0;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.logo::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:10px}
nav{display:flex;gap:6px;overflow-x:auto}
nav a{color:#aab4c3;padding:20px 16px;font-weight:500;border-bottom:2px solid transparent;text-decoration:none;white-space:nowrap;transition:color .2s}
nav a:hover{color:#fff}nav a.on{color:#fff;border-color:var(--gold)}
.hero{background:radial-gradient(900px 380px at 90% -10%,rgba(184,148,79,.28),transparent 70%),linear-gradient(135deg,#0E1A28 0%,#1C3250 100%);color:#fff;padding:68px 20px 76px}
.w{max-width:1150px;margin:auto}
.hero h1{font-size:clamp(30px,5.4vw,52px);font-weight:700;line-height:1.3;max-width:700px}
.hero h1::before{content:"";display:block;width:56px;height:3px;background:var(--gold);margin-bottom:22px;border-radius:2px}
.hero p{color:#c3ccd8;margin:16px 0 0;max-width:540px;font-size:17px}
main{padding:36px 20px 70px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 8px 28px rgba(18,32,47,.06);margin-top:-72px;position:relative}
.bar input,.bar select{background:#FBFAF6;border:1px solid var(--line);padding:10px 14px;border-radius:12px}
.bar input{flex:1 1 240px;min-width:0}.bar select{flex:1 1 150px;min-width:0;max-width:100%}
.chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 18px;cursor:pointer;font-weight:500;transition:all .2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{background:#fff;padding:16px 18px 18px;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;transition:transform .25s,box-shadow .25s;box-shadow:0 2px 8px rgba(18,32,47,.04)}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(18,32,47,.12)}
.card.f{--c:var(--green)}.card.s{--c:var(--ink2)}.card.g{--c:var(--copper)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);padding:1px 12px;border-radius:99px}
.card h3{font-size:18px;line-height:1.45;margin:8px 0 2px;font-weight:700}
.pl{color:var(--mut);font-size:14px}
.pay{font-size:20px;font-weight:700;margin:10px 0 12px;color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{background:#F4F0E6;font-size:12.5px;padding:2px 11px;border-radius:99px;color:#4b5563}
.th{display:block;height:auto;width:calc(100% + 36px);margin:-16px -18px 14px;aspect-ratio:4/3;object-fit:cover;object-position:top;background:#ECE7DA}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 8px rgba(18,32,47,.04)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:12px 14px;text-align:right;border-bottom:1px solid #EFEADD;font-size:14.5px}
th{background:var(--ink);color:#fff;cursor:pointer;position:sticky;top:0;white-space:nowrap;font-weight:600}
tr.r{cursor:pointer;transition:background .15s}tr.r:nth-child(even){background:#FBF9F4}tr.r:hover{background:var(--gold-s)}
.no{color:var(--red);font-weight:700}.ok{color:var(--green);font-weight:700}.un{color:var(--mut);font-weight:500}
.box{background:#fff;padding:22px 24px;margin-bottom:16px;border:1px solid var(--line);border-radius:var(--r)}
.box h2{font-size:18px;margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:10px}
.box h2::before{content:"";width:4px;height:18px;background:var(--gold);border-radius:2px}
.box ul{padding-inline-start:22px}.box li{margin:4px 0}
.back{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:8px 22px;font-weight:600;cursor:pointer;margin-bottom:18px;transition:border-color .2s}
.back:hover{border-color:var(--gold)}
.dh{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));color:#fff;padding:34px 30px;border-radius:20px;margin-bottom:16px;position:relative;overflow:hidden}
.dh::after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(184,148,79,.22)}
.dh span{font-size:13px;font-weight:600;background:rgba(255,255,255,.16);padding:2px 14px;border-radius:99px}
.dh.s{--c:var(--ink2)}.dh.f{--c:var(--green)}.dh.g{--c:var(--copper)}
.dh h1{font-size:clamp(24px,5vw,40px);font-weight:700;line-height:1.3;margin-top:10px}
.dh .pay{font-size:30px;margin:10px 0 0;color:#fff}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);margin-bottom:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:#fff;padding:14px 16px}.facts small{display:block;color:var(--mut);font-size:12.5px}.facts b{font-size:17px}
.cta{background:var(--gold);color:var(--ink);border:0;font-weight:700;font-size:17px;padding:13px 30px;cursor:pointer;border-radius:12px;transition:filter .2s}
.cta:hover{filter:brightness(1.07)}
.sec{background:#fff;border:1px solid var(--ink);color:var(--ink);font-weight:600;padding:12px 22px;cursor:pointer;margin-inline-start:10px;border-radius:12px;font-size:16px}
a.sec{display:inline-block;text-decoration:none}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.gal img{width:100%;display:block;background:#ECE7DA;border-radius:14px;border:1px solid var(--line)}
.gal figure{margin:0}
footer{text-align:center;color:var(--mut);padding:30px 20px 36px;font-size:14px;border-top:1px solid var(--line)}
footer a{color:var(--ink);font-weight:700;text-decoration:none}
#toast{position:fixed;bottom:20px;inset-inline:20px;margin:auto;max-width:420px;background:var(--ink);color:#fff;padding:12px 18px;text-align:center;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1}
#tr{position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .15s;cursor:pointer;text-align:center;padding:20px}
#tr.on{opacity:1;pointer-events:auto}
#tr .logo{font-size:52px}
#tr .pb{width:min(260px,70vw);height:3px;background:rgba(255,255,255,.18);overflow:hidden;border-radius:2px}
#tr .pb i{display:block;height:100%;background:var(--gold);transform-origin:right;transform:scaleX(0)}
#tr.on .pb i{animation:trf 1.25s linear forwards}
@keyframes trf{to{transform:scaleX(1)}}
#tr small{color:#aab4c3}
@media(prefers-reduced-motion:reduce){.card,.chip{transition:none}#tr{display:none}}
@media(max-width:600px){.hero{padding:44px 20px 70px}.bar{margin-top:-52px}.dh{padding:26px 22px}}
</style></head><body>

<header><div class="logo">شغلك</div><nav id="nav"></nav></header>
<div id="app"></div><footer id="ft"></footer><div id="toast" role="status"></div><div id="tr" role="status" aria-live="polite"></div>
<script src="data.js"></script><script src="app.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
